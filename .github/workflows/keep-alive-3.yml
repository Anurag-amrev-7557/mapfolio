name: Keep Backend Alive - 3
on:
  schedule:
    - cron: '* * * * *'  # Every minute at :40
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 40 seconds then ping
        run: |
          sleep 40
          curl -f https://mapfolio-api-gateway.onrender.com/health
          curl -f https://mapfolio-ai-services.onrender.com/health
          echo "Pinged at $(date)"