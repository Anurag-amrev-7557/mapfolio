name: Keep Backend Alive - 2
on:
  schedule:
    - cron: '* * * * *'  # Every minute at :20
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 20 seconds then ping
        run: |
          sleep 20
          curl -f https://mapfolio-api-gateway.onrender.com/health
          curl -f https://mapfolio-ai-services.onrender.com/health
          echo "Pinged at $(date)"