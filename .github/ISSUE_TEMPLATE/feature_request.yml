name: ✨ Feature Request
description: Propose a new feature, theme, or enhancement for Mapfolio
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an enhancement to Mapfolio!
  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: A concise summary of the feature or enhancement.
      placeholder: e.g. Support multi-track GPX overlay with separate color legends
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: What problem does this solve or what use case does it enable?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
