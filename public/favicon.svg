<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyanGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="emeraldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradFav)"/>
  <rect x="3" y="3" width="506" height="506" rx="125" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Topographic Ring Accents -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="3" fill="none">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="140"/>
    <circle cx="256" cy="256" r="100"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.22" filter="url(#favGlow)"/>

  <!-- Faceted Topographic Peaks -->
  <!-- Back / Right Peak -->
  <path d="M 334 170 L 416 380 L 252 380 Z" fill="url(#emeraldGradFav)" opacity="0.85"/>
  <path d="M 334 170 L 375 275 L 416 380 L 334 380 Z" fill="#059669"/>

  <!-- Front / Primary Peak -->
  <path d="M 230 100 L 350 380 L 110 380 Z" fill="url(#cyanGradFav)" opacity="0.95"/>
  <path d="M 230 100 L 290 240 L 350 380 L 230 380 Z" fill="#0284c7"/>

  <!-- Summit Pin Marker -->
  <circle cx="230" cy="100" r="24" fill="url(#goldGradFav)"/>
  <circle cx="230" cy="100" r="10" fill="#ffffff"/>

  <!-- Cardinal Points -->
  <circle cx="256" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="460" cy="256" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="460" r="6" fill="#34d399"/>
  <circle cx="52" cy="256" r="6" fill="#38bdf8"/>
</svg>