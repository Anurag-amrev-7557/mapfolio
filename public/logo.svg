<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emblem Primary Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald/Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Borders and Stroke -->
  <rect width="800" height="240" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="797" height="237" rx="26.5" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Topographic Contour Accents (Left Background) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <ellipse cx="120" cy="120" rx="90" ry="75"/>
    <ellipse cx="120" cy="120" rx="72" ry="58"/>
    <ellipse cx="120" cy="120" rx="54" ry="42"/>
    <ellipse cx="120" cy="120" rx="36" ry="26"/>
    <line x1="120" y1="20" x2="120" y2="220" stroke-dasharray="3 4"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke-dasharray="3 4"/>
  </g>

  <!-- Emblem / Icon Group (Center Left) -->
  <g transform="translate(60, 48)">
    <!-- Base Glow -->
    <circle cx="72" cy="72" r="54" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
    
    <!-- Outer Octagon Frame -->
    <polygon points="72,12 114,30 132,72 114,114 72,132 30,114 12,72 30,30" 
             fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Mountain Peaks (Faceted Topography) -->
    <path d="M 94 48 L 122 108 L 66 108 Z" fill="url(#emeraldGrad)" opacity="0.85"/>
    <path d="M 94 48 L 108 78 L 122 108 L 94 108 Z" fill="#059669"/>
    
    <path d="M 64 24 L 100 108 L 28 108 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <path d="M 64 24 L 82 66 L 100 108 L 64 108 Z" fill="#0284c7"/>

    <!-- Top Summit Location Marker Pin -->
    <circle cx="64" cy="24" r="7" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <circle cx="64" cy="24" r="3" fill="#ffffff"/>

    <!-- Compass Cardinal Marks -->
    <circle cx="72" cy="16" r="1.5" fill="#f59e0b"/>
    <circle cx="128" cy="72" r="1.5" fill="#38bdf8"/>
    <circle cx="72" cy="128" r="1.5" fill="#34d399"/>
    <circle cx="16" cy="72" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(232, 68)">
    <!-- Main Title "MAPFOLIO" -->
    <text x="0" y="52" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.04em" 
          fill="#ffffff">
      MAP<tspan fill="url(#goldGrad)">FOLIO</tspan>
    </text>

    <!-- PRO / STUDIO Badge -->
    <rect x="312" y="16" width="76" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="350" y="33" 
          font-family="'JetBrains Mono', 'Space Mono', monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="0.16em" 
          fill="#fbbf24" 
          text-anchor="middle">
      STUDIO
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="15" 
          font-weight="500" 
          letter-spacing="0.02em" 
          fill="#94a3b8">
      High-Precision Cartographic Poster Design Engine &amp; Vector GIS Studio
    </text>

    <!-- Feature Pills -->
    <g transform="translate(2, 106)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
      <!-- Pill 1: 4K Print -->
      <rect x="0" y="0" width="112" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="10" cy="11" r="3" fill="#38bdf8"/>
      <text x="20" y="15" fill="#cbd5e1">4K EXPORT</text>

      <!-- Pill 2: MapLibre -->
      <rect x="122" y="0" width="128" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="132" cy="11" r="3" fill="#34d399"/>
      <text x="142" y="15" fill="#cbd5e1">MAPLIBRE GL</text>

      <!-- Pill 3: OpenFreeMap -->
      <rect x="260" y="0" width="144" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="270" cy="11" r="3" fill="#fbbf24"/>
      <text x="280" y="15" fill="#cbd5e1">OPEN SOURCE</text>
    </g>
  </g>
</svg>
