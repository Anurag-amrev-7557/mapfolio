<svg width="840" height="240" viewBox="0 0 840 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Official Mapfolio Emblem Gradients -->
    <linearGradient id="peakLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="1" stop-color="#c9beac"/>
    </linearGradient>
    <linearGradient id="peakDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8998a"/>
      <stop offset="1" stop-color="#7d6f61"/>
    </linearGradient>
    <linearGradient id="hillLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8f89"/>
      <stop offset="1" stop-color="#2c6b68"/>
    </linearGradient>
    <linearGradient id="hillDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24504e"/>
      <stop offset="1" stop-color="#173a38"/>
    </linearGradient>
    <radialGradient id="pin" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0a860"/>
      <stop offset="1" stop-color="#c9622d"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="840" height="240" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="837" height="237" rx="26.5" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Topographic Iso-Lines in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <ellipse cx="130" cy="120" rx="100" ry="85"/>
    <ellipse cx="130" cy="120" rx="80" ry="65"/>
    <ellipse cx="130" cy="120" rx="60" ry="45"/>
    <ellipse cx="130" cy="120" rx="40" ry="30"/>
    <line x1="130" y1="15" x2="130" y2="225" stroke-dasharray="3 4"/>
    <line x1="25" y1="120" x2="235" y2="120" stroke-dasharray="3 4"/>
  </g>

  <!-- Official Logo Emblem (Scaled to fit container) -->
  <g transform="translate(45, 35)">
    <!-- Glow Backdrop -->
    <circle cx="85" cy="85" r="70" fill="#2c6b68" opacity="0.25" filter="url(#logoGlow)"/>

    <!-- Official SVG Vector Group -->
    <g transform="translate(85, 85) scale(0.38) translate(-284, -254)">
      <path d="M 342 214 L 452 396 L 232 396 Z" fill="url(#hillDark)"/>
      <path d="M 342 214 L 397 305 L 452 396 L 342 396 Z" fill="url(#hillLight)"/>
      <path d="M 244 128 L 372 396 L 116 396 Z" fill="url(#peakDark)"/>
      <path d="M 244 128 L 308 262 L 372 396 L 244 396 Z" fill="url(#peakLight)"/>
      <circle cx="244" cy="128" r="16" fill="url(#pin)"/>
    </g>
  </g>

  <!-- Brand Typography & Tagline -->
  <g transform="translate(236, 68)">
    <!-- Main Wordmark -->
    <text x="0" y="52" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.03em" 
          fill="#ffffff">
      MAP<tspan fill="url(#titleGold)">FOLIO</tspan>
    </text>

    <!-- PRO / STUDIO Badge -->
    <rect x="316" y="16" width="76" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="354" y="33" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="0.16em" 
          fill="#fbbf24" 
          text-anchor="middle">
      STUDIO
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="15" 
          font-weight="500" 
          letter-spacing="0.02em" 
          fill="#94a3b8">
      High-Precision Cartographic Poster Design Engine &amp; Vector GIS Studio
    </text>

    <!-- Feature Badges -->
    <g transform="translate(2, 106)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
      <!-- Pill 1: 4K Print -->
      <rect x="0" y="0" width="112" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="10" cy="11" r="3" fill="#38bdf8"/>
      <text x="20" y="15" fill="#cbd5e1">4K EXPORT</text>

      <!-- Pill 2: MapLibre -->
      <rect x="122" y="0" width="128" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="132" cy="11" r="3" fill="#34d399"/>
      <text x="142" y="15" fill="#cbd5e1">MAPLIBRE GL</text>

      <!-- Pill 3: OpenFreeMap -->
      <rect x="260" y="0" width="144" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="270" cy="11" r="3" fill="#fbbf24"/>
      <text x="280" y="15" fill="#cbd5e1">OPEN SOURCE</text>
    </g>
  </g>
</svg>
