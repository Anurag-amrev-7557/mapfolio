<svg width="840" height="240" viewBox="0 0 840 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Official Mapfolio Low-Poly Mountain Gradients -->
    <linearGradient id="peakLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ede0"/>
      <stop offset="1%" stop-color="#c9beac"/>
    </linearGradient>
    <linearGradient id="peakDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8998a"/>
      <stop offset="1%" stop-color="#7d6f61"/>
    </linearGradient>
    <linearGradient id="hillLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f8f89"/>
      <stop offset="1%" stop-color="#2c6b68"/>
    </linearGradient>
    <linearGradient id="hillDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24504e"/>
      <stop offset="1%" stop-color="#173a38"/>
    </linearGradient>
    <radialGradient id="pin" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#f0a860"/>
      <stop offset="1%" stop-color="#c9622d"/>
    </radialGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="goldWordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="840" height="240" rx="24" fill="url(#bannerBg)"/>
  <rect x="1" y="1" width="838" height="238" rx="23" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow Behind Icon -->
  <circle cx="125" cy="120" r="75" fill="#2c6b68" opacity="0.28" filter="url(#softGlow)"/>

  <!-- Official Mapfolio Low-Poly Mountain Icon -->
  <g transform="translate(125, 120) scale(0.44) translate(-284, -254)">
    <path d="M 342 214 L 452 396 L 232 396 Z" fill="url(#hillDark)"/>
    <path d="M 342 214 L 397 305 L 452 396 L 342 396 Z" fill="url(#hillLight)"/>
    <path d="M 244 128 L 372 396 L 116 396 Z" fill="url(#peakDark)"/>
    <path d="M 244 128 L 308 262 L 372 396 L 244 396 Z" fill="url(#peakLight)"/>
    <circle cx="244" cy="128" r="16" fill="url(#pin)"/>
  </g>

  <!-- Brand Typography & Tagline -->
  <g transform="translate(245, 68)">
    <!-- Wordmark -->
    <text x="0" y="52" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.03em" 
          fill="#ffffff">
      MAP<tspan fill="url(#goldWordmark)">FOLIO</tspan>
    </text>

    <!-- STUDIO Badge -->
    <rect x="316" y="16" width="76" height="26" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="354" y="33" 
          font-family="'JetBrains Mono', 'Space Mono', monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="0.16em" 
          fill="#fbbf24" 
          text-anchor="middle">
      STUDIO
    </text>

    <!-- Tagline -->
    <text x="2" y="86" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="15" 
          font-weight="500" 
          letter-spacing="0.01em" 
          fill="#94a3b8">
      High-Precision Cartographic Poster Design Engine &amp; Vector GIS Studio
    </text>

    <!-- Feature Pills -->
    <g transform="translate(2, 106)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
      <!-- 4K Export -->
      <rect x="0" y="0" width="112" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="10" cy="11" r="3" fill="#38bdf8"/>
      <text x="20" y="15" fill="#cbd5e1">4K EXPORT</text>

      <!-- MapLibre GL -->
      <rect x="122" y="0" width="128" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="132" cy="11" r="3" fill="#34d399"/>
      <text x="142" y="15" fill="#cbd5e1">MAPLIBRE GL</text>

      <!-- Open Source -->
      <rect x="260" y="0" width="144" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="270" cy="11" r="3" fill="#fbbf24"/>
      <text x="280" y="15" fill="#cbd5e1">OPEN SOURCE</text>
    </g>
  </g>
</svg>
