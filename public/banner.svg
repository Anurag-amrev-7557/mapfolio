<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Spatial Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Outer Border Subtle Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.3)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="80%" stop-color="rgba(245, 158, 11, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Official Mapfolio Low-Poly Mountain Gradients -->
    <linearGradient id="peakLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="1" stop-color="#c9beac"/>
    </linearGradient>
    <linearGradient id="peakDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8998a"/>
      <stop offset="1" stop-color="#7d6f61"/>
    </linearGradient>
    <linearGradient id="hillLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8f89"/>
      <stop offset="1" stop-color="#2c6b68"/>
    </linearGradient>
    <linearGradient id="hillDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24504e"/>
      <stop offset="1" stop-color="#173a38"/>
    </linearGradient>
    <radialGradient id="pin" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0a860"/>
      <stop offset="1" stop-color="#c9622d"/>
    </radialGradient>

    <!-- Warm Amber Wordmark Gradient -->
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="auraLeft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
    <filter id="auraRight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Glassmorphic Border -->
  <rect width="880" height="260" rx="24" fill="url(#mainBg)"/>
  <rect x="1" y="1" width="878" height="258" rx="23" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Ambient Halo (Deep Teal / Emerald) -->
  <circle cx="140" cy="130" r="100" fill="#2c6b68" opacity="0.32" filter="url(#auraLeft)"/>
  <!-- Right Ambient Halo (Warm Amber) -->
  <circle cx="700" cy="90" r="120" fill="#d97706" opacity="0.12" filter="url(#auraRight)"/>

  <!-- Topographic Contour Rings & Compass Grid Elements -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <circle cx="140" cy="130" r="105"/>
    <circle cx="140" cy="130" r="88" stroke-dasharray="3 4"/>
    <circle cx="140" cy="130" r="68"/>
    <!-- Compass Crosshairs -->
    <line x1="140" y1="14" x2="140" y2="246" stroke-dasharray="2 6"/>
    <line x1="24" y1="130" x2="256" y2="130" stroke-dasharray="2 6"/>
  </g>

  <!-- Sub-grid Coordinates Background Marks -->
  <g opacity="0.15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">
    <text x="820" y="32" text-anchor="end">37.7890° N</text>
    <text x="820" y="46" text-anchor="end">122.3867° W</text>
    <text x="820" y="238" text-anchor="end">300 DPI • 4K</text>
    <circle cx="836" cy="27" r="1.5" fill="#38bdf8"/>
    <circle cx="836" cy="41" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- Left Emblem Group: Circular Lens + Official Low-Poly Peaks -->
  <g transform="translate(140, 130)">
    <!-- Frosted Lens Background -->
    <circle cx="0" cy="0" r="64" fill="#0b1320" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Compass Cardinal Notches -->
    <line x1="0" y1="-64" x2="0" y2="-56" stroke="#f59e0b" stroke-width="2"/>
    <line x1="64" y1="0" x2="56" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="64" x2="0" y2="56" stroke="#34d399" stroke-width="1.5"/>
    <line x1="-64" y1="0" x2="-56" y2="0" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Official SVG Mountain Peak Group -->
    <g transform="scale(0.38) translate(-284, -254)">
      <path d="M 342 214 L 452 396 L 232 396 Z" fill="url(#hillDark)"/>
      <path d="M 342 214 L 397 305 L 452 396 L 342 396 Z" fill="url(#hillLight)"/>
      <path d="M 244 128 L 372 396 L 116 396 Z" fill="url(#peakDark)"/>
      <path d="M 244 128 L 308 262 L 372 396 L 244 396 Z" fill="url(#peakLight)"/>
      <circle cx="244" cy="128" r="16" fill="url(#pin)" filter="url(#pinGlow)"/>
      <circle cx="244" cy="128" r="7" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Brand Typography, Tagline, & Feature Badges -->
  <g transform="translate(280, 60)">
    <!-- Wordmark "MAPFOLIO" -->
    <text x="0" y="56" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="56" 
          font-weight="900" 
          letter-spacing="0.02em" 
          fill="#ffffff">
      MAP<tspan fill="url(#brandGold)">FOLIO</tspan>
    </text>

    <!-- "PRO STUDIO" Pill Badge -->
    <g transform="translate(332, 20)">
      <rect x="0" y="0" width="102" height="28" rx="8" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="3.5" fill="#fbbf24"/>
      <text x="56" y="18.5" 
            font-family="'JetBrains Mono', 'Space Mono', monospace" 
            font-size="11" 
            font-weight="800" 
            letter-spacing="0.14em" 
            fill="#fbbf24" 
            text-anchor="middle">
        STUDIO
      </text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="2" y="94" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="15" 
          font-weight="500" 
          letter-spacing="0.01em" 
          fill="#94a3b8">
      High-Precision Cartographic Poster Design Engine &amp; Vector GIS Studio
    </text>

    <!-- Interactive Feature Badges -->
    <g transform="translate(2, 118)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
      <!-- 4K UHD Export -->
      <rect x="0" y="0" width="124" height="25" rx="12.5" fill="rgba(255,255,255,0.06)" stroke="rgba(56,189,248,0.3)"/>
      <circle cx="12" cy="12.5" r="3" fill="#38bdf8"/>
      <text x="24" y="16" fill="#e2e8f0">4K / 300 DPI</text>

      <!-- 60 FPS WebGL -->
      <rect x="134" y="0" width="138" height="25" rx="12.5" fill="rgba(255,255,255,0.06)" stroke="rgba(52,211,153,0.3)"/>
      <circle cx="146" cy="12.5" r="3" fill="#34d399"/>
      <text x="158" y="16" fill="#e2e8f0">MAPLIBRE GL v3</text>

      <!-- OpenFreeMap -->
      <rect x="282" y="0" width="132" height="25" rx="12.5" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.3)"/>
      <circle cx="294" cy="12.5" r="3" fill="#fbbf24"/>
      <text x="306" y="16" fill="#e2e8f0">OPENFREEMAP</text>

      <!-- OSRM & GPX -->
      <rect x="424" y="0" width="132" height="25" rx="12.5" fill="rgba(255,255,255,0.06)" stroke="rgba(168,85,247,0.3)"/>
      <circle cx="436" cy="12.5" r="3" fill="#a855f7"/>
      <text x="448" y="16" fill="#e2e8f0">GPX &amp; OSRM</text>
    </g>
  </g>
</svg>
